name: Build cluster-compatible GROMACS GPU

on:
  push:
    branches:
      - main
      - feature/fixed-molecular-com
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cluster-gpu-cuda:
    # The cluster has no outbound GitHub connection, so this job must run on
    # a GitHub-hosted runner. The build itself runs in an NVIDIA CUDA 12.4
    # CentOS 7 container to retain the cluster's glibc 2.17 compatibility.
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and package GPU installation
        env:
          BUILD_JOBS: 4
          CUDA_CONTAINER: nvidia/cuda:12.4.0-devel-centos7
        run: ./admin/ci-scripts/build-cluster-gpu-cuda.sh

      - name: Upload cluster artifact
        uses: actions/upload-artifact@v4
        with:
          name: gromacs-2026.3-cluster-gpu-cuda-${{ github.sha }}
          path: |
            build/artifacts/*.tar.gz
            build/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30
